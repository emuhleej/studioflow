project_id = "studioflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173"]
enable_signup = true

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.media-upload-start]
verify_jwt = false
[functions.media-upload-part]
verify_jwt = false
[functions.media-upload-complete]
verify_jwt = false
[functions.media-upload-cancel]
verify_jwt = false
[functions.media-upload-resume]
verify_jwt = false
[functions.media-url]
verify_jwt = false
[functions.media-delete]
verify_jwt = false
[functions.metadata-backup]
verify_jwt = false
